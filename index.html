<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crafty</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://api.lanyard.rest" crossorigin>
<link rel="preconnect" href="https://cdn.discordapp.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://api.lanyard.rest">
<link rel="dns-prefetch" href="https://cdn.discordapp.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">

<style>

:root{
    --blurple:#5865F2;
    --blurple-glow:rgba(88,101,242,.55);
    --bg:#050506;
    --panel:#0b0b0e;
    --panel-2:#0f0f13;
    --line:#1c1c22;
    --line-hover:#5865F2;
    --text-dim:#8a8a93;
    --text-dimmer:#55555c;
    --green:#23a559;
    --spotify:#1DB954;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    color-scheme:dark;
}

body {
    font-family:'Inter', Arial, sans-serif;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    padding:60px 20px;
    position:relative;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(88,101,242,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,101,242,.06) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, black 10%, transparent 75%);
    mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, black 10%, transparent 75%);
    pointer-events:none;
    z-index:0;
}

.glow-orb{
    position:fixed;
    width:600px;
    height:600px;
    border-radius:50%;
    background:radial-gradient(circle, var(--blurple-glow) 0%, transparent 70%);
    top:-260px;
    left:50%;
    transform:translateX(-50%);
    opacity:.35;
    filter:blur(10px);
    pointer-events:none;
    z-index:0;
    animation:orb-pulse 6s ease-in-out infinite;
}

@keyframes orb-pulse{
    0%,100%{ opacity:.28; }
    50%{ opacity:.42; }
}

.container {
    text-align:center;
    position:relative;
    z-index:1;
    animation:rise .7s cubic-bezier(.16,1,.3,1) both;
}

@keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
}

h1 {
    font-family:'Space Grotesk', sans-serif;
    font-size:68px;
    font-weight:700;
    letter-spacing:-2.5px;
    line-height:1.05;
}

.blurple {
    color:var(--blurple);
    text-shadow:
    0 0 18px rgba(88,101,242,.75),
    0 0 40px rgba(88,101,242,.35);
}

.main-text {
    margin-top:16px;
    color:var(--text-dim);
    font-size:18px;
    letter-spacing:.01em;
}

.main-text .sep{
    color:var(--text-dimmer);
    margin:0 8px;
}

.view-projects{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    color:var(--blurple);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:10px 18px;
    border:1px solid var(--line);
    border-radius:100px;
    background:var(--panel);
    transition:.25s ease;
}

.view-projects i{
    transition:transform .25s ease;
    font-size:12px;
}

.view-projects:hover{
    border-color:var(--blurple);
    box-shadow:0 0 20px rgba(88,101,242,.28);
    color:white;
}

.view-projects:hover i{
    transform:translateX(4px);
}

.icons {
    margin-top:32px;
    display:flex;
    justify-content:center;
    gap:16px;
}

.icon {
    width:56px;
    height:56px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:24px;
    text-decoration:none;
    cursor:pointer;
    transition:.3s cubic-bezier(.16,1,.3,1);
    position:relative;
}

.icon:hover {
    transform:translateY(-6px);
    color:var(--blurple);
    border-color:var(--blurple);
    box-shadow:0 8px 24px rgba(88,101,242,.35);
}

.card-perspective{
    margin:38px auto 0;
    width:380px;
    max-width:100%;
    perspective:900px;
}

.discord-card {
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:22px;
    padding:0;
    text-align:left;
    transition:transform .12s ease-out, border-color .3s ease, box-shadow .3s ease;
    position:relative;
    transform-style:preserve-3d;
    will-change:transform;
}

.discord-card.hovering{
    border-color:var(--blurple);
    box-shadow:0 20px 50px -10px rgba(88,101,242,.4);
}

.card-banner{
    height:74px;
    width:100%;
    border-radius:22px 22px 0 0;
    background:
        radial-gradient(circle at 20% 0%, rgba(88,101,242,.55), transparent 55%),
        radial-gradient(circle at 80% 100%, rgba(88,101,242,.3), transparent 55%),
        linear-gradient(120deg, #14141c, #0a0a0d);
    position:relative;
    overflow:hidden;
}

.card-banner::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:14px 14px;
    -webkit-mask-image:linear-gradient(180deg, black, transparent);
    mask-image:linear-gradient(180deg, black, transparent);
}

.card-body{
    padding:0 20px 20px;
}

.discord-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    padding-top:14px;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-dim);
}

.discord-header-left {
    display:flex;
    align-items:center;
    gap:8px;
}

.discord-header i {
    color:var(--blurple);
}

.discord-user {
    display:flex;
    align-items:flex-end;
    gap:16px;
    margin-top:-30px;
}

.avatar-wrap {
    position:relative;
    width:76px;
    height:76px;
    flex-shrink:0;
}

.avatar-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--blurple), transparent 40%, var(--blurple));
    animation:spin 4s linear infinite;
    opacity:0;
    transition:opacity .3s ease;
}

.avatar-ring.active{
    opacity:1;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.discord-user img.avatar {
    width:76px;
    height:76px;
    border-radius:50%;
    display:block;
    border:4px solid var(--panel);
    position:relative;
    background:var(--panel);
}

.avatar-decoration {
    position:absolute;
    top:-8px;
    left:-8px;
    width:92px;
    height:92px;
    pointer-events:none;
}

.status-dot{
    position:absolute;
    bottom:-2px;
    right:-2px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--panel);
    border:3px solid var(--panel);
    box-sizing:content-box;
    display:flex;
    align-items:center;
    justify-content:center;
}

.status-dot svg{
    width:100%;
    height:100%;
    display:block;
}

.status-dot.vr {
    background:var(--green);
}

.status-dot.vr i {
    font-size:9px;
    color:#000000;
}

.name-block{
    padding-bottom:4px;
}

.discord-user h3 {
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    font-weight:600;
}

.discord-user p {
    margin-top:4px;
    color:var(--text-dim);
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
}

/* Badges */

.badges {
    margin-top:18px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.badges.hidden {
    display:none;
}

.badge {
    width:28px;
    height:28px;
    border-radius:9px;
    background:var(--panel);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:var(--blurple);
    transition:.25s ease;
}

.badge:hover{
    border-color:var(--blurple);
    transform:translateY(-2px);
}

/* Activity row (non-spotify) */
.activity-row{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dim);
    font-size:13px;
}

.activity-row i{
    color:var(--blurple);
    font-size:13px;
}


.spotify-card {
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    display:none;
    align-items:center;
    gap:12px;
}

.spotify-card.show {
    display:flex;
}

.spotify-card img {
    width:48px;
    height:48px;
    border-radius:9px;
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(29,185,84,.25);
}

.spotify-info {
    min-width:0;
    flex:1;
}

.spotify-info .sp-title {
    font-size:12px;
    font-weight:700;
    color:var(--spotify);
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.04em;
    text-transform:uppercase;
}

.spotify-info .sp-song {
    margin-top:4px;
    font-size:13px;
    color:white;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.spotify-info .sp-artist {
    margin-top:2px;
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sp-bars {
    display:flex;
    align-items:flex-end;
    gap:2.5px;
    height:16px;
    flex-shrink:0;
}

.sp-bars span {
    width:3px;
    background:var(--spotify);
    border-radius:1px;
    animation:sp-bounce 1s ease-in-out infinite;
}

.sp-bars span:nth-child(1){height:40%;animation-delay:0s;}
.sp-bars span:nth-child(2){height:100%;animation-delay:.2s;}
.sp-bars span:nth-child(3){height:60%;animation-delay:.4s;}

@keyframes sp-bounce {
    0%,100% { height:30%; }
    50% { height:100%; }
}

.notification {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:var(--blurple);
    padding:12px 25px;
    border-radius:12px;
    font-size:14px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:.3s ease;
    box-shadow:0 10px 30px rgba(88,101,242,.4);
    z-index:20;
}

.notification.show {
    opacity:1;
    bottom:50px;
}


.lanyard-reminder {
    position:fixed;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:11px 20px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:9px;
    opacity:0;
    filter:blur(8px);
    pointer-events:none;
    transition:opacity 1s ease, filter 1s ease;
    z-index:999;
}

.lanyard-reminder i {
    color:var(--blurple);
}

.lanyard-reminder.show {
    opacity:1;
    filter:blur(0px);
}


.spotify-embed-wrap {
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    display:none;
}

.spotify-embed-wrap.show {
    display:block;
}

.spotify-embed-wrap iframe {
    border-radius:12px;
    width:100%;
}

@media (prefers-reduced-motion: reduce){
    *{
        animation-duration:0.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:0.01ms !important;
    }
}

@media (max-width:420px){
    h1{ font-size:44px; }
    .discord-card{ width:100%; }
}

</style>

</head>


<body>

<div class="glow-orb"></div>

<div class="container">

<h1>
Hey, I'm <span class="blurple">Crafty!</span>

Management, programming, moderation & VR

<a href="projects.html" class="view-projects">

<script>

function copyDiscord(){
navigator.clipboard.writeText("crafty.js");
let notification = document.getElementById("notification");
notification.classList.add("show");
setTimeout(()=>{ notification.classList.remove("show"); },2500);
}

const discordID = "1315134950185373697";

const statusLabels = {
    online:"Online",
    idle:"Idle",
    dnd:"Do Not Disturb",
    offline:"Offline"
};

const BADGE_FLAGS = [
    { bit:1<<0,  icon:"fa-solid fa-user-shield",  title:"Discord Staff" },
    { bit:1<<1,  icon:"fa-solid fa-handshake",    title:"Partnered Server Owner" },
    { bit:1<<2,  icon:"fa-solid fa-bolt",         title:"HypeSquad Events" },
    { bit:1<<3,  icon:"fa-solid fa-bug",          title:"Bug Hunter Level 1" },
    { bit:1<<6,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Bravery" },
    { bit:1<<7,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Brilliance" },
    { bit:1<<8,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Balance" },
    { bit:1<<9,  icon:"fa-solid fa-star",         title:"Early Supporter" },
    { bit:1<<14, icon:"fa-solid fa-bug",          title:"Bug Hunter Level 2" },
    { bit:1<<16, icon:"fa-solid fa-code",         title:"Early Verified Bot Developer" },
    { bit:1<<17, icon:"fa-solid fa-certificate",  title:"Discord Certified Moderator" },
    { bit:1<<22, icon:"fa-solid fa-hammer",       title:"Active Developer" }
];

function renderBadges(publicFlags){
    const container = document.getElementById("badges");
    container.innerHTML = "";
    if(!publicFlags){ container.classList.add("hidden"); return; }
    const owned = BADGE_FLAGS.filter(b => (publicFlags & b.bit) === b.bit);
    if(owned.length === 0){ container.classList.add("hidden"); return; }
    container.classList.remove("hidden");
    owned.forEach(b=>{
        const el = document.createElement("div");
        el.className = "badge";
        el.title = b.title;
        el.innerHTML = `<i class="${b.icon}"></i>`;
        container.appendChild(el);
    });
}

let currentSpotifyTrack = null;

function renderSpotify(user){
    const wrap = document.getElementById("spotify-embed-wrap");
    const iframe = document.getElementById("spotify-embed");
    const activityRow = document.getElementById("activity-row");

    if(user.listening_to_spotify && user.spotify && user.spotify.track_id){
        if(currentSpotifyTrack !== user.spotify.track_id){
            currentSpotifyTrack = user.spotify.track_id;
            iframe.src = `https://open.spotify.com/embed/track/${user.spotify.track_id}?utm_source=generator&theme=0&autoplay=1`;
            iframe.height = "152";
        }
        wrap.classList.add("show");
        activityRow.style.display = "none";
    } else {
        currentSpotifyTrack = null;
        wrap.classList.remove("show");
        iframe.src = "";
    }
}

function renderPresence(user){

    document.getElementById("discord-name").innerText =
    user.discord_user.global_name || user.discord_user.username;

    const avatar = user.discord_user.avatar;
    document.getElementById("discord-avatar").src =
    avatar
    ? `https://cdn.discordapp.com/avatars/${user.discord_user.id}/${avatar}.png?size=128`
    : "https://cdn.discordapp.com/embed/avatars/0.png";

    const decoEl = document.getElementById("avatar-decoration");
    const decoration = user.discord_user.avatar_decoration_data;

    if(decoration && decoration.asset){
        decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoration.asset}.png?size=160`;
        decoEl.style.display = "block";
    } else {
        decoEl.style.display = "none";
    }

    const activityRow = document.getElementById("activity-row");
    const hasSpotify = user.listening_to_spotify && user.spotify && user.spotify.track_id;

    if(user.activities && user.activities.length > 0 && !hasSpotify){
        const activity = user.activities.find(a => a.type !== 4 && a.type !== 2) || user.activities[0];
        document.getElementById("discord-activity").innerText = activity.name;
        activityRow.style.display = "flex";
    } else if(!hasSpotify){
        document.getElementById("discord-activity").innerText = "No activity";
        activityRow.style.display = "flex";
    }

    renderBadges(user.discord_user.public_flags);
    renderSpotify(user);

    const dot = document.getElementById("status-dot");
    const ring = document.getElementById("avatar-ring");
    const rawStatus = user.discord_status || "offline";

    dot.setAttribute("data-status", rawStatus);
    ring.classList.toggle("active", rawStatus !== "offline");

    document.getElementById("status").innerText =
    statusLabels[rawStatus] || rawStatus;

    const onVR = user.activities && user.activities.some(a =>
    a.name && a.name.toLowerCase().includes("vr")
    );

    dot.classList.remove("vr");
    dot.innerHTML = "";

    if(rawStatus === "online" && onVR){
        dot.classList.add("vr");
        dot.innerHTML = '<i class="fa-solid fa-vr-cardboard"></i>';
        document.getElementById("status").innerText = "Online on VR";
    }
}

function setOffline(){
    document.getElementById("discord-activity").innerText = "Offline";
    document.getElementById("activity-row").style.display = "flex";
    document.getElementById("status-dot").setAttribute("data-status","offline");
    document.getElementById("avatar-ring").classList.remove("active");
    document.getElementById("status").innerText = "Offline";
}

let socket;
let heartbeatInterval;
let reconnectTimeout;

function connectLanyard(){
    try {
        socket = new WebSocket("wss://api.lanyard.rest/socket");

        socket.onopen = () => {
            socket.send(JSON.stringify({
                op:2,
                d:{ subscribe_to_id: discordID }
            }));
        };

        socket.onmessage = (event) => {
            const payload = JSON.parse(event.data);

            if(payload.op === 1){
                const interval = payload.d.heartbeat_interval;
                heartbeatInterval = setInterval(()=>{
                    if(socket.readyState === WebSocket.OPEN){
                        socket.send(JSON.stringify({ op:3 }));
                    }
                }, interval);
            }

            if(payload.t === "INIT_STATE" || payload.t === "PRESENCE_UPDATE"){
                renderPresence(payload.d);
            }
        };

        socket.onclose = () => {
            clearInterval(heartbeatInterval);
            reconnectTimeout = setTimeout(connectLanyard, 5000);
        };

        socket.onerror = () => {
            socket.close();
        };

    } catch(e){
        fallbackFetch();
    }
}

function fallbackFetch(){
    fetch(`https://api.lanyard.rest/v1/users/${discordID}`)
    .then(res=>res.json())
    .then(data=> renderPresence(data.data))
    .catch(setOffline);
}

connectLanyard();

(function(){
    const card = document.getElementById("discord-card");
    if(!card) return;
    const maxTilt = 10;

    function onMove(e){
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const rotateY = (x - 0.5) * maxTilt * 2;
        const rotateX = (0.5 - y) * maxTilt * 2;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(6px)`;
    }

    function onEnter(){
        card.classList.add("hovering");
    }

    function onLeave(){
        card.classList.remove("hovering");
        card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0px)";
    }

    if(window.matchMedia("(hover: hover) and (pointer: fine)").matches){
        card.addEventListener("mousemove", onMove);
        card.addEventListener("mouseenter", onEnter);
        card.addEventListener("mouseleave", onLeave);
    }
})();

window.addEventListener("DOMContentLoaded", () => {
    const reminder = document.getElementById("lanyard-reminder");
    setTimeout(()=>{
        reminder.classList.add("show");
        setTimeout(()=>{
            reminder.classList.remove("show");
        }, 4000);
    }, 400);
});

</script>
